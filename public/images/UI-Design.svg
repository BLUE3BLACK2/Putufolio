<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#uiBg)" stroke="#BFDBFE" stroke-width="2"/>

  <!-- Mobile UI Mockup 1 -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="200" height="370" rx="24" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(37, 99, 235, 0.15))"/>
    <!-- Speaker & Camera notch -->
    <rect x="70" y="10" width="60" height="14" rx="7" fill="#1E293B"/>
    <!-- Header -->
    <circle cx="28" cy="45" r="12" fill="#2563EB"/>
    <rect x="50" y="40" width="80" height="10" rx="5" fill="#1E293B"/>
    <!-- Hero card -->
    <rect x="15" y="70" width="170" height="100" rx="14" fill="#2563EB"/>
    <circle cx="150" cy="120" r="30" fill="#3B82F6" opacity="0.6"/>
    <rect x="30" y="90" width="90" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="30" y="110" width="60" height="6" rx="3" fill="#93C5FD"/>
    <rect x="30" y="130" width="70" height="22" rx="11" fill="#FACC15"/>
    <text x="65" y="145" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#18181B" text-anchor="middle">Explore</text>

    <!-- Grid items -->
    <rect x="15" y="185" width="80" height="75" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="205" r="10" fill="#10B981"/>
    <rect x="25" y="225" width="50" height="6" rx="3" fill="#1E293B"/>
    <rect x="25" y="237" width="30" height="5" rx="2.5" fill="#94A3B8"/>

    <rect x="105" y="185" width="80" height="75" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="125" cy="205" r="10" fill="#F59E0B"/>
    <rect x="115" y="225" width="50" height="6" rx="3" fill="#1E293B"/>
    <rect x="115" y="237" width="30" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Bottom tab bar -->
    <rect x="15" y="320" width="170" height="36" rx="18" fill="#1E293B"/>
    <circle cx="45" cy="338" r="6" fill="#FACC15"/>
    <circle cx="100" cy="338" r="6" fill="#94A3B8"/>
    <circle cx="155" cy="338" r="6" fill="#94A3B8"/>
  </g>

  <!-- Mobile UI Mockup 2 (Behind/Tilted) -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="200" height="350" rx="24" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(37, 99, 235, 0.15))"/>
    <rect x="70" y="10" width="60" height="14" rx="7" fill="#1E293B"/>
    <text x="100" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1E293B" text-anchor="middle">Statistics &amp; Metrics</text>
    
    <!-- Chart graphic -->
    <path d="M 25 150 L 60 120 L 100 135 L 140 80 L 175 100" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="140" cy="80" r="4" fill="#2563EB"/>
    <path d="M 25 150 L 60 120 L 100 135 L 140 80 L 175 100 L 175 170 L 25 170 Z" fill="#3B82F6" fill-opacity="0.15"/>

    <rect x="25" y="195" width="150" height="40" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="45" cy="215" r="10" fill="#F59E0B"/>
    <rect x="65" y="210" width="80" height="7" rx="3.5" fill="#92400E"/>

    <rect x="25" y="245" width="150" height="40" rx="8" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
    <circle cx="45" cy="265" r="10" fill="#16A34A"/>
    <rect x="65" y="260" width="80" height="7" rx="3.5" fill="#166534"/>
  </g>

  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#2563EB"/>
    <text x="50" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">UI DESIGN</text>
  </g>
</svg>
