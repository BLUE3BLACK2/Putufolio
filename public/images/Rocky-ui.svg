<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="#090D16" stroke="#334155" stroke-width="2"/>

  <!-- Browser / App Header bar -->
  <rect x="0" y="0" width="600" height="42" rx="20" fill="#1E293B"/>
  <circle cx="25" cy="21" r="5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5" fill="#FACC15"/>
  <circle cx="59" cy="21" r="5" fill="#10B981"/>
  <rect x="180" y="10" width="240" height="22" rx="11" fill="#0F172A"/>
  <text x="300" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">rocky-ai.app/scan</text>

  <!-- Left Side: Live Camera Viewfinder -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="280" height="350" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="140" cy="150" r="60" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- Object -->
    <rect x="115" y="110" width="50" height="85" rx="8" fill="#38BDF8" opacity="0.6"/>
    <text x="140" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tin Can</text>
    
    <rect x="20" y="280" width="240" height="45" rx="22" fill="#2563EB"/>
    <text x="140" y="308" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✨ AI Scan Material</text>
  </g>

  <!-- Right Side: AI Generated Craft Plans -->
  <g transform="translate(330, 65)">
    <!-- Header -->
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Smart Craft Suggestions</text>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">3 Upcycling pathways found</text>

    <!-- Card 1 -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="240" height="80" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <circle cx="30" cy="40" r="18" fill="#10B981" fill-opacity="0.2"/>
      <text x="30" y="46" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🌱</text>
      <text x="60" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Herb Planter</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#A7F3D0">Difficulty: Easy · 15 mins</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="240" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="40" r="18" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="30" y="46" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✏️</text>
      <text x="60" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Desk Pen Holder</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Difficulty: Easy · 10 mins</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="240" height="80" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="40" r="18" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="30" y="46" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🏮</text>
      <text x="60" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Lantern Light</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Difficulty: Medium · 30 mins</text>
    </g>
  </g>
</svg>
